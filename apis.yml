name: Novus
description: 'Novus (operating as SEI Novus) is a portfolio intelligence and investment
  analytics platform for institutional investors — endowments, foundations, sovereign
  wealth funds, family offices, pension funds, and asset managers. The platform provides
  manager monitoring, performance analysis, risk assessment, attribution, and reporting
  across public and private markets at the position, fund, and portfolio level, along
  with data integration and maintenance services. Originally venture-backed (Index
  Ventures among its investors), Novus was acquired by SEI and now operates as SEI
  Novus. It has been recognized as Best Portfolio Management Vendor (Family Wealth
  Report Awards) and Best Multi-Asset Class Portfolio Management System (PAM Awards).
  No public developer API is currently published on its website.'
